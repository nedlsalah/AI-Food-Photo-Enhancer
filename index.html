<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Food Photo Enhancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.14.0"
        }
      }
    </script>
    <script type="module" src="index.tsx"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>AI Food Photo Enhancer</h1>
            <p>Turn one photo into ten unique, professional images automatically.</p>
        </header>
        <main>
            <div id="controls">
                <section class="card">
                    <h2>1. Upload Your Photo</h2>
                    <div id="drop-zone" role="button" aria-label="Upload photo drop zone">
                        <div id="drop-zone-prompt">
                            <input type="file" id="file-input" accept="image/jpeg, image/png" hidden>
                            <img src="https://storage.googleapis.com/gemini-ui-params/images/upload_icon.svg" alt="Upload Icon" class="upload-icon">
                            <p><strong>Drag & drop</strong> your photo here, or <strong>click to browse</strong>.</p>
                            <small>Supports JPG and PNG files.</small>
                        </div>
                        <div id="drop-zone-preview" class="hidden">
                           <img id="preview-image" src="" alt="Uploaded image preview">
                           <button id="change-photo-btn" class="button-secondary">Change Photo</button>
                        </div>
                    </div>
                </section>

                <div id="error-message" class="error-message hidden" role="alert"></div>
                <button id="enhance-btn" disabled>Generate 10 Styles</button>
            </div>

            <div id="results-container" class="hidden" aria-live="polite">
                 <div class="card">
                    <div class="results-header">
                        <h2>Results</h2>
                        <button id="download-all-btn" class="button-secondary hidden">Download All</button>
                    </div>
                     <div id="results-grid">
                        <!-- Generated images will be injected here by JS -->
                     </div>
                 </div>
            </div>
        </main>
        <footer>
            <p>Powered by Google Gemini</p>
        </footer>
    </div>
    <div id="loader" class="hidden" role="status" aria-label="Processing your image">
        <div class="spinner"></div>
        <p id="loader-text">Our AI chef is plating your photo...</p>
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>
</body>
</html>
